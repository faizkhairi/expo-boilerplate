version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Expo pins these per SDK (bundledNativeModules.json). Upgrade them
    # together with `npx expo install expo@^<sdk> --fix`, never one by one.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "@types/react"
      # Majors held back on purpose. Drop an entry once its blocker clears.
      # eslint-config-expo 57 peers on plugins that do not accept ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # The Expo SDK pins the TypeScript line it supports.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # jest-expo 57 runs on Jest 29.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # NativeWind 4 supports Tailwind CSS 3 only.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
